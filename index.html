<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Bondev</title>
    <meta
      name="description"
      content="Trouve ce qui existe, fais-toi aider, aide les autres : la plateforme d'entraide des développeurs africains."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#050816" />
    <script>
      // Pose le thème avant la première peinture pour éviter tout flash clair.
      (function () {
        try {
          var root = document.documentElement
          var saved = localStorage.getItem('bondev-theme')
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          root.dataset.theme = theme
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f9ff' : '#050816')
        } catch (error) {
          /* Le thème par défaut reste sombre. */
        }
      })()
    </script>
    <link rel="canonical" href="https://bondev.ngassakindzaa.workers.dev" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link
      rel="preload"
      href="/fonts/montserrat-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- VITE_SUPABASE_PRECONNECT -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bondev" />
    <meta property="og:title" content="Bondev" />
    <meta
      property="og:description"
      content="Trouve ce qui existe, fais-toi aider, aide les autres : la plateforme d'entraide des développeurs africains."
    />
    <meta property="og:url" content="https://bondev.ngassakindzaa.workers.dev" />
    <meta
      property="og:image"
      content="https://bondev.ngassakindzaa.workers.dev/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bondev, la plateforme d'entraide des développeurs africains" />
    <meta property="og:locale" content="fr_FR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bondev" />
    <meta
      name="twitter:description"
      content="Trouve ce qui existe, fais-toi aider, aide les autres : la plateforme d'entraide des développeurs africains."
    />
    <meta
      name="twitter:image"
      content="https://bondev.ngassakindzaa.workers.dev/og-image.png"
    />
    <style>
      /* Écran de démarrage en HTML/CSS pur : il disparaît au montage de React. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 72% 22%, rgba(123, 63, 242, 0.18), transparent 34%),
          radial-gradient(circle at 24% 76%, rgba(30, 167, 255, 0.16), transparent 36%),
          #050816;
        transition: opacity 0.46s ease, visibility 0.46s ease;
      }
      html[data-theme='light'] #splash {
        background:
          radial-gradient(circle at 72% 22%, rgba(123, 63, 242, 0.1), transparent 34%),
          radial-gradient(circle at 24% 76%, rgba(30, 167, 255, 0.12), transparent 36%),
          #eef3ff;
      }
      #splash .splash-inner {
        display: grid;
        justify-items: center;
        gap: 14px;
        transform: translateY(-2vh);
      }
      #splash img {
        width: 104px;
        height: 104px;
        object-fit: contain;
        filter: drop-shadow(0 22px 42px rgba(47, 107, 255, 0.36));
        animation: splash-pulse 2.2s ease-in-out infinite;
      }
      #splash b {
        font-family: Montserrat, 'Segoe UI', system-ui, sans-serif;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.035em;
        color: #f2f6ff;
      }
      html[data-theme='light'] #splash b {
        color: #111936;
      }
      #splash i {
        width: 42px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, #1ea7ff, #2f6bff 55%, #7b3ff2);
        opacity: 0.8;
        animation: splash-line 2.2s ease-in-out infinite;
      }
      #splash.splash-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      @keyframes splash-pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.055);
          opacity: 1;
        }
      }
      @keyframes splash-line {
        0%, 100% {
          transform: scaleX(0.72);
          opacity: 0.55;
        }
        50% {
          transform: scaleX(1);
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash i {
          animation: none;
        }
        #splash {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-inner">
        <img src="/assets/bondev-logo-192.webp" width="104" height="104" alt="" />
        <b>Bondev</b>
        <i></i>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
